name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deploy

jobs:
  deploy:
    name: Deploy to EC2 (production)
    runs-on: ubuntu-latest
    environment: production     # Requires manual approval gate in GitHub Environments
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # -----------------------------------------------------------------
      # Build and push Docker images to ECR (or GHCR)
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/api
            ghcr.io/${{ github.repository }}/worker
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository }}/worker:${{ github.sha }},ghcr.io/${{ github.repository }}/worker:latest
          labels: ${{ steps.meta.outputs.labels }}

      # -----------------------------------------------------------------
      # Deploy to EC2 via SSH
      # -----------------------------------------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,GITHUB_REPOSITORY
          timeout: 600s
          script: |
            set -euo pipefail

            echo "==> Deploying commit $IMAGE_TAG"
            cd /opt/chatbot

            # Pull latest compose files
            git fetch origin main
            git reset --hard origin/main

            # Log in to GHCR on EC2
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api worker

            # Run migrations before switching traffic
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              run --rm api uv run alembic upgrade head

            # Rolling restart: zero-downtime for stateless services
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps --wait api worker

            # Cleanup dangling images
            docker image prune -f

            echo "==> Deploy complete"

      # -----------------------------------------------------------------
      # Smoke test — verify API is healthy after deploy
      # -----------------------------------------------------------------
      - name: Smoke test
        run: |
          sleep 10
          RESPONSE=$(curl -sf --max-time 10 https://${{ secrets.EC2_HOST }}/health || echo "FAILED")
          echo "Health check response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"' || (echo "Health check failed!" && exit 1)

      # -----------------------------------------------------------------
      # Notify on failure
      # -----------------------------------------------------------------
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed: ${context.sha.substring(0, 7)}`,
              body: `Deploy workflow failed.\n\nCommit: ${context.sha}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['deploy-failure']
            })
