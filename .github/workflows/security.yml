name: Security

on:
  schedule:
    - cron: "0 4 * * 1"    # Every Monday at 04:00 UTC
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "ui/package.json"
      - "ui/package-lock.json"
      - "Dockerfile*"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write    # Required for uploading SARIF to GitHub Security tab

jobs:
  # ---------------------------------------------------------------------------
  # Python dependency audit — pip-audit
  # ---------------------------------------------------------------------------
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Run pip-audit
        run: uv run pip-audit --requirement <(uv export --format requirements-txt --no-hashes) --output-format json --output pip-audit-results.json
        continue-on-error: true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json

  # ---------------------------------------------------------------------------
  # Node dependency audit — npm audit
  # ---------------------------------------------------------------------------
  node-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: npm audit
        working-directory: ui
        run: npm audit --audit-level=high
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Docker image vulnerability scan — Trivy
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Docker scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build API image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: chatbot-api:scan

      - name: Run Trivy on API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: chatbot-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"    # Don't fail CI — report only

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Secret scanning — Gitleaks
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # Full history for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # CodeQL — static analysis for Python
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
