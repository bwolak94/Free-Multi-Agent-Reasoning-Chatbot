services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:${IMAGE_TAG:-latest}
    restart: always
    build: !reset null
    volumes: !reset []

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/worker:${IMAGE_TAG:-latest}
    restart: always
    build: !reset null
    volumes: !reset []

  postgres:
    restart: always
    volumes:
      - /opt/chatbot/pgdata:/var/lib/postgresql/data

  redis:
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - /opt/chatbot/redis_data:/data

  searxng:
    restart: always

  langfuse-server:
    restart: always

  # ---------------------------------------------------------------------------
  # nginx — production: TLS via Let's Encrypt, no profiles gate
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: always
    profiles: !reset []          # remove the "proxy" profile gate from dev config
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /opt/chatbot/letsencrypt:/etc/letsencrypt:ro
      - /opt/chatbot/certbot/www:/var/www/certbot:ro
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Certbot — issues and renews Let's Encrypt certificates
  # Run manually: docker compose run --rm certbot certonly ...
  # Auto-renew: docker compose run --rm certbot renew
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    volumes:
      - /opt/chatbot/letsencrypt:/etc/letsencrypt
      - /opt/chatbot/certbot/www:/var/www/certbot
    profiles:
      - certbot    # run with: docker compose --profile certbot run certbot
